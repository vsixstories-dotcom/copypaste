<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Offline Text Sharing</title>

<style>
body {
    font-family: Arial, sans-serif;
    max-width: 700px;
    margin: 40px auto;
    padding: 20px;
    background: #f1f5f9;
}

.container {
    background: white;
    padding: 25px;
    border-radius: 12px;
}

h1 {
    color: #1d4ed8;
}

input, textarea, button {
    width: 100%;
    box-sizing: border-box;
    padding: 12px;
    margin: 8px 0;
    font-size: 16px;
}

textarea {
    height: 180px;
}

button {
    background: #2563eb;
    color: white;
    border: none;
    cursor: pointer;
    border-radius: 5px;
}

button:hover {
    background: #1d4ed8;
}

.note {
    color: #64748b;
    font-size: 14px;
}
</style>
</head>

<body>
<div class="container">
    <h1>Offline Text Sharing</h1>

    <p class="note">
        Save text as a file and transfer it using a USB drive.
        Open the saved file on another computer by selecting it below.
    </p>

    <h3>1. Save Text</h3>

    <input id="saveName" placeholder="Enter filename (e.g. project.txt)">

    <textarea id="saveText" placeholder="Enter your text here..."></textarea>

    <button onclick="saveTextFile()">Download Text File</button>

    <hr>

    <h3>2. Retrieve Text</h3>

    <p>Select a text file copied from the other computer.</p>

    <input type="file" id="openFile" accept=".txt,.md,.csv">

    <div id="result"></div>

    <textarea id="displayText" placeholder="Retrieved text will appear here..." readonly></textarea>
</div>

<script>
function saveTextFile() {
    const name = document.getElementById("saveName").value.trim();
    const text = document.getElementById("saveText").value;

    if (!name) {
        alert("Please enter a filename.");
        return;
    }

    if (/[\\/]/.test(name) || name === "." || name === "..") {
        alert("Please enter a valid filename.");
        return;
    }

    const filename = name.endsWith(".txt") ? name : name + ".txt";

    const blob = new Blob([text], {
        type: "text/plain;charset=utf-8"
    });

    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");

    link.href = url;
    link.download = filename;
    link.click();

    setTimeout(() => URL.revokeObjectURL(url), 1000);
}

document.getElementById("openFile").addEventListener("change", async function() {
    const file = this.files[0];

    if (!file) return;

    const text = await file.text();

    document.getElementById("displayText").value = text;
    document.getElementById("result").textContent =
        "Loaded file: " + file.name;
});
</script>
</body>
</html>
